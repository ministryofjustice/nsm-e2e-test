name: "Run E2E Tests"
description: "Run end-to-end tests for the LAA crime forms services"

on:
  workflow_call:
    inputs:
      submit-image-name:
        description: "Name of the container image to use for laa-submit-crime-forms"
        default: "latest"
        required: false
        type: string
      assess-image-name:
        description: "Name of the container image to use for laa-assess-crime-forms"
        default: "latest"
        required: false
        type: string
      appstore-image-name:
        description: "Name of the container image to use for laa-crime-application-store"
        default: "latest"
        required: false
        type: string

jobs:
  run-e2e-tests:
    name: "Run E2E Tests"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NSCC_PROVIDER_IMAGE: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.SUBMIT_DEV_ECR_REPOSITORY }}:${{ inputs.submit-image-name }}
      NSCC_APPSTORE_IMAGE: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.APP_STORE_DEV_ECR_REPOSITORY }}:${{ inputs.appstore-image-name }}
      NSCC_CASEWORKER_IMAGE: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ASSESS_DEV_ECR_REPOSITORY }}:${{ inputs.assess-image-name }}
      E2E_CHECKOUT_AUTH: ${{ secrets.NSM_E2E_CHECKOUT_APP_CLIENT_ID != '' && secrets.NSM_E2E_CHECKOUT_APP_PRIVATE_KEY != '' && 'app' || 'default' }}
    steps:
      - name: Create E2E checkout token for trusted callers
        id: e2e-checkout-token
        if: >-
          env.E2E_CHECKOUT_AUTH == 'app' &&
          (github.repository == 'ministryofjustice/laa-submit-crime-forms' ||
           github.repository == 'ministryofjustice/laa-assess-crime-forms' ||
           github.repository == 'ministryofjustice/laa-crime-application-store') &&
          github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.NSM_E2E_CHECKOUT_APP_CLIENT_ID }}
          private-key: ${{ secrets.NSM_E2E_CHECKOUT_APP_PRIVATE_KEY }}
          owner: ministryofjustice
          repositories: nsm-e2e-test
          permission-contents: read

      - name: Checkout E2E Test Repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          repository: ministryofjustice/nsm-e2e-test
          path: e2e-tests
          token: ${{ steps.e2e-checkout-token.outputs.token || github.token }}
          persist-credentials: false

      # laa-submit-crime-forms
      - name: Configure AWS credentials for laa-submit-crime-forms
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/ecr-auth@e5500aa20b13a1406fe8a62b8788181a2ca18926
        with:
          ecr_role: ${{ secrets.SUBMIT_DEV_ECR_ROLE_TO_ASSUME }}
          ecr_region: ${{ vars.SUBMIT_DEV_ECR_REGION }}
          role-session-name: ${{ vars.ECR_ROLE_SESSION_NAME }}

      - name: Pull laa-submit-crime-forms image
        shell: bash
        working-directory: e2e-tests
        run: docker pull $NSCC_PROVIDER_IMAGE

      # laa-crime-application-store
      - name: Configure AWS credentials for laa-crime-application-store
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/ecr-auth@e5500aa20b13a1406fe8a62b8788181a2ca18926
        with:
          ecr_role: ${{ secrets.APP_STORE_DEV_ECR_ROLE_TO_ASSUME }}
          ecr_region: ${{ vars.APP_STORE_DEV_ECR_REGION }}
          role-session-name: ${{ vars.ECR_ROLE_SESSION_NAME }}

      - name: Pull laa-crime-application-store image
        shell: bash
        working-directory: e2e-tests
        run: docker pull $NSCC_APPSTORE_IMAGE

      # laa-assess-crime-forms
      - name: Configure AWS credentials for laa-assess-crime-forms
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/ecr-auth@e5500aa20b13a1406fe8a62b8788181a2ca18926
        with:
          ecr_role: ${{ secrets.ASSESS_DEV_ECR_ROLE_TO_ASSUME }}
          ecr_region: ${{ vars.ASSESS_DEV_ECR_REGION }}
          role-session-name: ${{ vars.ECR_ROLE_SESSION_NAME }}

      - name: Pull NSCC laa-assess-crime-forms image
        shell: bash
        working-directory: e2e-tests
        run: docker pull $NSCC_CASEWORKER_IMAGE

      - name: Build and check/wait for services
        shell: bash
        working-directory: e2e-tests
        run: |
          docker compose build --no-cache
          docker compose run start_applications

      - name: Run end-to-end tests
        shell: bash
        working-directory: e2e-tests
        run: |
          set +e
          docker compose run --name laa-crime-forms-e2e-run laa-crime-forms-end-to-end-tests

      - name: Output container logs on failure
        if: ${{ failure() }}
        shell: bash
        working-directory: e2e-tests
        run: docker compose logs

      - name: Copy Playwright outputs from container
        if: ${{ failure() }}
        shell: bash
        working-directory: e2e-tests
        run: |
          docker cp laa-crime-forms-e2e-run:/app/test-results ./

      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: playwright-artifacts
          if-no-files-found: warn
          path: |
            e2e-tests/test-results
            e2e-tests/playwright-report
